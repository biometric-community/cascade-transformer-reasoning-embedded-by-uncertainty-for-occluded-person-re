paper:
  slug: cascade-transformer-reasoning-embedded-by-uncertainty-for-occluded-person-re
  title: "Cascade Transformer Reasoning Embedded by Uncertainty for Occluded Person Re-Identification"
  doi: "10.1109/TBIOM.2024.3361677"
  method: CTU
data:
  root: ../../datasets/market1501
  height: 256
  width: 128
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
  random_erasing: true
  num_workers: 2
  max_train_samples: 1024
  max_eval_samples: 512
model:
  dim: 256
  num_layers: 2
  num_heads: 4
  n_samples: 2
  beta: 1.38629436112
train:
  epochs: 1
  batch_size: 32
  num_instances: 4
  lr: 0.00035
  weight_decay: 0.0005
  margin: 0.3
  warmup_epochs: 1
  log_every: 5
  eval_every: 1
eval:
  batch_size: 32
  ranks: [1, 5, 10]
output:
  dir: outputs
  checkpoints: outputs/checkpoints
  logs: outputs/logs
  figures: outputs/figures
